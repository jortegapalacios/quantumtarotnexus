<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Desafío del Módulo 1 | Quantum Tarot Nexus</title>

  <style>
    :root {
      --marfil: #f7f2e8;
      --marfil-claro: #fffaf1;
      --azul: #07182d;
      --azul-claro: #102a48;
      --dorado: #c79632;
      --dorado-claro: #ecd28e;
      --texto: #122238;
      --verde: #17603d;
      --rojo: #8b2525;
      --sombra: 0 18px 48px rgba(31, 22, 10, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 22px;

      color: var(--texto);

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(199, 150, 50, 0.10),
          transparent 24%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(199, 150, 50, 0.08),
          transparent 25%
        ),
        var(--marfil);

      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      position: relative;
      width: min(1180px, 100%);
      min-height: 650px;
      overflow: hidden;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 252, 246, 0.98),
          rgba(247, 242, 232, 0.98)
        );

      box-shadow: var(--sombra);
    }

    .app::before,
    .app::after {
      content: "✦";

      position: absolute;
      z-index: 0;

      color: rgba(199, 150, 50, 0.16);

      font-size: 190px;
      line-height: 1;

      pointer-events: none;
    }

    .app::before {
      top: -55px;
      left: -42px;
    }

    .app::after {
      right: -42px;
      bottom: -70px;
    }

    .pantalla {
      position: relative;
      z-index: 1;

      display: none;

      min-height: 650px;
      padding: 38px 48px 34px;
    }

    .pantalla.activa {
      display: flex;
      flex-direction: column;
    }

    /* CABECERA */

    .cabecera {
      display: grid;

      grid-template-columns:
        1fr auto 1fr;

      align-items: center;

      gap: 18px;

      margin-bottom: 26px;
    }

    .marca {
      text-align: center;
    }

    .marca strong {
      display: block;

      color: var(--azul);

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 400;

      letter-spacing: 0.12em;
    }

    .marca span {
      display: block;

      margin-top: 2px;

      color: var(--dorado);

      font-size: 0.78rem;
      font-weight: 700;

      letter-spacing: 0.35em;
    }

    .codex {
      justify-self: end;

      display: flex;
      align-items: center;

      gap: 10px;

      color: var(--azul);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.85rem;

      letter-spacing: 0.08em;
    }

    .codex-icono {
      display: grid;
      place-items: center;

      width: 44px;
      height: 56px;

      border: 2px solid var(--dorado);
      border-radius: 5px;

      color: var(--dorado);

      background: var(--azul);

      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.18);
    }

    .volver {
      justify-self: start;

      display: grid;
      place-items: center;

      width: 48px;
      height: 48px;

      border: 2px solid var(--dorado);
      border-radius: 50%;

      color: var(--dorado);

      background: var(--azul);

      cursor: pointer;

      font-size: 1.5rem;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .volver:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 20px rgba(7, 24, 45, 0.22);
    }

    /* CONTENIDO DE PREGUNTAS */

    .modulo-etiqueta {
      display: inline-flex;
      align-items: center;

      gap: 12px;

      margin-bottom: 18px;
    }

    .modulo-etiqueta strong {
      padding: 8px 16px;

      border-radius: 999px;

      color: var(--dorado-claro);

      background: var(--azul);

      font-size: 0.85rem;

      letter-spacing: 0.08em;
    }

    .modulo-etiqueta span {
      color: var(--dorado);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.95rem;
    }

    .zona-pregunta {
      display: grid;

      grid-template-columns:
        minmax(0, 1.25fr)
        minmax(260px, 0.75fr);

      align-items: center;

      gap: 42px;

      flex: 1;
    }

    .contador {
      margin: 0 0 12px;

      color: var(--azul);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.5rem;
    }

    .pregunta {
      margin: 0 0 25px;

      color: var(--azul);

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 4.1vw, 3.3rem);
      font-weight: 400;

      line-height: 1.12;
    }

    .alternativas {
      display: grid;

      gap: 12px;
    }

    .alternativa {
      width: 100%;

      padding: 16px 18px;

      border: 1px solid rgba(199, 150, 50, 0.65);
      border-radius: 12px;

      color: var(--texto);

      background:
        rgba(255, 252, 246, 0.74);

      text-align: left;

      cursor: pointer;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;

      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease,
        box-shadow 0.18s ease;
    }

    .alternativa:hover {
      transform: translateX(5px);

      border-color: var(--dorado);

      background: #fffdf8;

      box-shadow:
        0 8px 20px rgba(51, 35, 11, 0.08);
    }

    .alternativa:disabled {
      cursor: default;
      opacity: 0.82;
    }

    .panel-visual {
      display: grid;
      place-items: center;

      min-height: 390px;
    }

    .carta {
      position: relative;

      display: grid;
      place-items: center;

      width: min(260px, 78%);
      aspect-ratio: 0.64;

      border: 4px solid var(--dorado);
      border-radius: 19px;

      color: var(--dorado);

      background:
        radial-gradient(
          circle,
          transparent 0 20%,
          rgba(199, 150, 50, 0.20) 21% 21.5%,
          transparent 22% 34%,
          rgba(199, 150, 50, 0.18) 35% 35.5%,
          transparent 36%
        ),
        linear-gradient(
          145deg,
          #0b2039,
          #04101f
        );

      box-shadow:
        0 24px 40px rgba(7, 24, 45, 0.24);

      transform: rotate(3deg);
    }

    .carta::before {
      content: "☼";

      font-size: clamp(5.5rem, 12vw, 9rem);

      text-shadow:
        0 0 22px rgba(199, 150, 50, 0.25);
    }

    .carta::after {
      content: "✦";

      position: absolute;
      top: 24px;
      left: 50%;

      transform: translateX(-50%);

      font-size: 1.4rem;
    }

    /* PROGRESO */

    .pie-pregunta {
      display: grid;

      grid-template-columns:
        auto 1fr auto;

      align-items: center;

      gap: 20px;

      margin-top: 28px;
    }

    .pista {
      max-width: 420px;

      padding: 14px 17px;

      border: 1px solid rgba(199, 150, 50, 0.45);
      border-radius: 12px;

      color: #344157;

      background: rgba(255, 255, 255, 0.35);

      font-family: Georgia, "Times New Roman", serif;

      line-height: 1.45;
    }

    .progreso {
      display: flex;
      justify-content: center;

      gap: 12px;
    }

    .punto {
      width: 18px;
      height: 18px;

      border: 1px solid rgba(199, 150, 50, 0.65);
      border-radius: 50%;

      background: transparent;
    }

    .punto.activo {
      background: var(--dorado);

      box-shadow:
        0 0 0 5px rgba(199, 150, 50, 0.12);
    }

    .puntuacion {
      color: var(--azul);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
    }

    /* RETROALIMENTACIÓN */

    .overlay {
      position: fixed;
      z-index: 20;

      inset: 0;

      display: none;
      place-items: center;

      padding: 24px;

      background: rgba(7, 24, 45, 0.56);

      backdrop-filter: blur(5px);
    }

    .overlay.visible {
      display: grid;
    }

    .retro {
      width: min(510px, 100%);

      padding: 35px 32px;

      border: 2px solid var(--dorado);
      border-radius: 22px;

      color: var(--texto);

      background:
        linear-gradient(
          145deg,
          #fffdf8,
          var(--marfil)
        );

      text-align: center;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.28);

      animation:
        aparecer 0.25s ease-out;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .retro-icono {
      display: grid;
      place-items: center;

      width: 76px;
      height: 76px;

      margin: 0 auto 20px;

      border: 3px solid var(--dorado);
      border-radius: 50%;

      color: var(--dorado-claro);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.8rem;
      font-weight: 700;
    }

    .retro.error .retro-icono {
      background: var(--rojo);
    }

    .retro.correcto .retro-icono {
      background: var(--verde);
    }

    .retro h2 {
      margin: 0 0 14px;

      color: var(--azul);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: 400;
    }

    .retro p {
      margin: 0 auto 24px;

      max-width: 400px;

      color: #38455a;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.08rem;

      line-height: 1.55;
    }

    .boton {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 230px;

      padding: 15px 26px;

      border: 1px solid var(--dorado);
      border-radius: 11px;

      color: var(--dorado-claro);

      background:
        linear-gradient(
          145deg,
          var(--azul-claro),
          var(--azul)
        );

      cursor: pointer;

      font-weight: 700;

      letter-spacing: 0.07em;

      text-transform: uppercase;

      box-shadow:
        0 9px 22px rgba(7, 24, 45, 0.22);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .boton:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 28px rgba(7, 24, 45, 0.30);
    }

    /* RESULTADOS */

    .resultado {
      display: grid;
      place-items: center;

      flex: 1;

      text-align: center;
    }

    .resultado-contenido {
      width: min(780px, 100%);
    }

    .cristal {
      display: grid;
      place-items: center;

      width: 150px;
      height: 150px;

      margin: 0 auto 25px;

      clip-path:
        polygon(
          50% 0%,
          83% 20%,
          100% 62%,
          72% 100%,
          28% 100%,
          0% 62%,
          17% 20%
        );

      color: white;

      background:
        linear-gradient(
          145deg,
          #dffbff,
          #6ce4ff 33%,
          #2f78d5 70%,
          #5843bd
        );

      font-size: 3.5rem;

      box-shadow:
        0 0 45px rgba(77, 211, 255, 0.55);

      animation:
        flotar 2.4s ease-in-out infinite;
    }

    @keyframes flotar {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .resultado h1 {
      margin: 0 0 13px;

      color: var(--azul);

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.6rem, 6vw, 4.4rem);
      font-weight: 400;
    }

    .resultado h2 {
      margin: 0 0 18px;

      color: var(--dorado);

      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
    }

    .resultado p {
      max-width: 650px;

      margin: 0 auto 22px;

      color: #455066;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;

      line-height: 1.6;
    }

    .recompensas {
      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 14px;

      margin: 28px 0;
    }

    .recompensa {
      padding: 18px 14px;

      border: 1px solid rgba(199, 150, 50, 0.45);
      border-radius: 14px;

      background: rgba(255, 255, 255, 0.45);
    }

    .recompensa strong {
      display: block;

      margin-bottom: 4px;

      color: var(--azul);

      font-family: Georgia, "Times New Roman", serif;
    }

    .recompensa span {
      color: #5e6675;

      font-size: 0.9rem;
    }

    .acciones {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 14px;
    }

    .boton-secundario {
      color: var(--azul);
      background: transparent;
    }

    /* RESPONSIVE */

    @media (max-width: 850px) {
      body {
        padding: 0;
      }

      .app {
        min-height: 100vh;

        border-radius: 0;
      }

      .pantalla {
        min-height: 100vh;

        padding: 25px 20px;
      }

      .cabecera {
        grid-template-columns:
          auto 1fr auto;
      }

      .codex span {
        display: none;
      }

      .zona-pregunta {
        grid-template-columns:
          1fr;
      }

      .panel-visual {
        display: none;
      }

      .pie-pregunta {
        grid-template-columns:
          1fr;
      }

      .pista,
      .puntuacion {
        text-align: center;
      }

      .recompensas {
        grid-template-columns:
          1fr;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- PANTALLA DEL QUIZ -->

    <section
      id="pantallaQuiz"
      class="pantalla activa"
    >

      <header class="cabecera">

        <button
          class="volver"
          type="button"
          aria-label="Volver al inicio del desafío"
          onclick="reiniciarDesafio()"
        >
          ←
        </button>

        <div class="marca">
          <strong>QUANTUM TAROT</strong>
          <span>NEXUS</span>
        </div>

        <div class="codex">
          <span>CODEX QUANTUM</span>

          <div class="codex-icono" aria-hidden="true">
            ✦
          </div>
        </div>

      </header>

      <div class="modulo-etiqueta">
        <strong>MÓDULO 1</strong>
        <span>Historia y origen del Tarot</span>
      </div>

      <div class="zona-pregunta">

        <section>

          <p
            id="contador"
            class="contador"
          >
            Pregunta 1 de 5
          </p>

          <h1
            id="pregunta"
            class="pregunta"
          ></h1>

          <div
            id="alternativas"
            class="alternativas"
          ></div>

        </section>

        <aside class="panel-visual">
          <div
            class="carta"
            aria-label="Reverso de una carta de Tarot"
          ></div>
        </aside>

      </div>

      <footer class="pie-pregunta">

        <div
          id="pista"
          class="pista"
        ></div>

        <div
          id="progreso"
          class="progreso"
          aria-label="Progreso del desafío"
        ></div>

        <div
          id="puntuacion"
          class="puntuacion"
        >
          Aciertos: 0
        </div>

      </footer>

    </section>

    <!-- PANTALLA FINAL -->

    <section
      id="pantallaResultado"
      class="pantalla"
    >

      <header class="cabecera">

        <div></div>

        <div class="marca">
          <strong>QUANTUM TAROT</strong>
          <span>NEXUS</span>
        </div>

        <div class="codex">
          <span>CODEX QUANTUM</span>

          <div class="codex-icono" aria-hidden="true">
            ✦
          </div>
        </div>

      </header>

      <div class="resultado">

        <div class="resultado-contenido">

          <div
            id="cristal"
            class="cristal"
            aria-hidden="true"
          >
            ✦
          </div>

          <h1 id="tituloResultado"></h1>

          <h2 id="subtituloResultado"></h2>

          <p id="mensajeResultado"></p>

          <div
            id="recompensas"
            class="recompensas"
          ></div>

          <div
            id="accionesResultado"
            class="acciones"
          ></div>

        </div>

      </div>

    </section>

  </main>

  <!-- VENTANA DE RETROALIMENTACIÓN -->

  <div
    id="overlay"
    class="overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="retroTitulo"
  >

    <div
      id="retro"
      class="retro"
    >

      <div
        id="retroIcono"
        class="retro-icono"
        aria-hidden="true"
      ></div>

      <h2 id="retroTitulo"></h2>

      <p id="retroTexto"></p>

      <button
        id="retroBoton"
        class="boton"
        type="button"
      ></button>

    </div>

  </div>

  <script>
    "use strict";

    /*
      CAMBIA EL ENLACE DE ABAJO cuando tengas creada
      la página o el contenido del Módulo 2.
    */

    const enlaceModulo2 = "#";

    const preguntas = [
      {
        pregunta:
          "¿En qué siglo apareció el Tarot como juego de cartas en Europa?",

        alternativas: [
          "Siglo XIII",
          "Siglo XIV",
          "Siglo XV",
          "Siglo XVII"
        ],

        correcta: 2,

        pista:
          "Reflexiona sobre el contexto histórico del Renacimiento italiano.",

        explicacion:
          "Los primeros mazos documentados aparecieron durante el siglo XV en las cortes del norte de Italia."
      },

      {
        pregunta:
          "¿Cuántas cartas tiene un mazo tradicional de Tarot?",

        alternativas: [
          "56 cartas",
          "66 cartas",
          "78 cartas",
          "88 cartas"
        ],

        correcta: 2,

        pista:
          "El mazo está formado por Arcanos Mayores y Arcanos Menores.",

        explicacion:
          "El Tarot tradicional contiene 78 cartas: 22 Arcanos Mayores y 56 Arcanos Menores."
      },

      {
        pregunta:
          "¿Cuál fue la función inicial del Tarot en Europa?",

        alternativas: [
          "Predecir el futuro",
          "Servir como juego de cartas",
          "Practicar rituales religiosos",
          "Interpretar sueños"
        ],

        correcta: 1,

        pista:
          "Antes de convertirse en un lenguaje simbólico, el Tarot tuvo una función recreativa.",

        explicacion:
          "El Tarot comenzó como un juego de cartas utilizado en las cortes europeas."
      },

      {
        pregunta:
          "¿Qué ocurrió con el Tarot a través del tiempo?",

        alternativas: [
          "Perdió todas sus imágenes",
          "Se mantuvo únicamente como un juego",
          "Sus imágenes adquirieron significados simbólicos",
          "Desapareció durante varios siglos"
        ],

        correcta: 2,

        pista:
          "Piensa en la transformación que convirtió las imágenes en un lenguaje.",

        explicacion:
          "Con el tiempo, las imágenes del Tarot adquirieron significados simbólicos, filosóficos y psicológicos."
      },

      {
        pregunta:
          "¿Cuál de estas afirmaciones es un mito sobre el Tarot?",

        alternativas: [
          "Puede favorecer la reflexión",
          "Está compuesto por símbolos",
          "Solo sirve para predecir el futuro",
          "Surgió en Europa"
        ],

        correcta: 2,

        pista:
          "El Tarot puede utilizarse con propósitos más amplios que la adivinación.",

        explicacion:
          "Es un mito afirmar que el Tarot solo sirve para predecir el futuro. También puede utilizarse para reflexionar y explorar posibilidades."
      }
    ];

    let indiceActual = 0;
    let aciertos = 0;
    let respondida = false;

    const pantallaQuiz =
      document.getElementById("pantallaQuiz");

    const pantallaResultado =
      document.getElementById("pantallaResultado");

    const contador =
      document.getElementById("contador");

    const preguntaElemento =
      document.getElementById("pregunta");

    const alternativasElemento =
      document.getElementById("alternativas");

    const pistaElemento =
      document.getElementById("pista");

    const progresoElemento =
      document.getElementById("progreso");

    const puntuacionElemento =
      document.getElementById("puntuacion");

    const overlay =
      document.getElementById("overlay");

    const retro =
      document.getElementById("retro");

    const retroIcono =
      document.getElementById("retroIcono");

    const retroTitulo =
      document.getElementById("retroTitulo");

    const retroTexto =
      document.getElementById("retroTexto");

    const retroBoton =
      document.getElementById("retroBoton");

    function mostrarPregunta() {
      respondida = false;

      const item =
        preguntas[indiceActual];

      contador.textContent =
        `Pregunta ${indiceActual + 1} de ${preguntas.length}`;

      preguntaElemento.textContent =
        item.pregunta;

      pistaElemento.textContent =
        item.pista;

      puntuacionElemento.textContent =
        `Aciertos: ${aciertos}`;

      alternativasElemento.innerHTML = "";

      item.alternativas.forEach(
        (texto, indice) => {
          const boton =
            document.createElement("button");

          boton.type = "button";
          boton.className = "alternativa";
          boton.textContent = texto;

          boton.addEventListener(
            "click",
            () => responder(indice)
          );

          alternativasElemento.appendChild(boton);
        }
      );

      progresoElemento.innerHTML = "";

      preguntas.forEach(
        (_, indice) => {
          const punto =
            document.createElement("span");

          punto.className =
            indice === indiceActual
              ? "punto activo"
              : "punto";

          progresoElemento.appendChild(punto);
        }
      );
    }

    function responder(indiceSeleccionado) {
      if (respondida) {
        return;
      }

      respondida = true;

      const item =
        preguntas[indiceActual];

      const esCorrecta =
        indiceSeleccionado === item.correcta;

      if (esCorrecta) {
        aciertos += 1;
      }

      bloquearAlternativas();

      mostrarRetroalimentacion(
        esCorrecta,
        item.explicacion
      );
    }

    function bloquearAlternativas() {
      const botones =
        alternativasElemento.querySelectorAll(
          ".alternativa"
        );

      botones.forEach(
        boton => {
          boton.disabled = true;
        }
      );
    }

    function mostrarRetroalimentacion(
      esCorrecta,
      explicacion
    ) {
      retro.className =
        esCorrecta
          ? "retro correcto"
          : "retro error";

      retroIcono.textContent =
        esCorrecta ? "✓" : "×";

      retroTitulo.textContent =
        esCorrecta
          ? "¡Correcto!"
          : "Respuesta incorrecta";

      retroTexto.textContent =
        explicacion;

      retroBoton.textContent =
        indiceActual === preguntas.length - 1
          ? "Ver resultado"
          : "Continuar";

      retroBoton.onclick = continuar;

      overlay.classList.add("visible");
    }

    function continuar() {
      overlay.classList.remove("visible");

      if (
        indiceActual <
        preguntas.length - 1
      ) {
        indiceActual += 1;
        mostrarPregunta();
        return;
      }

      mostrarResultado();
    }

    function mostrarResultado() {
      pantallaQuiz.classList.remove("activa");

      pantallaResultado.classList.add("activa");

      const aprobado =
        aciertos >= 4;

      const titulo =
        document.getElementById("tituloResultado");

      const subtitulo =
        document.getElementById("subtituloResultado");

      const mensaje =
        document.getElementById("mensajeResultado");

      const recompensas =
        document.getElementById("recompensas");

      const acciones =
        document.getElementById("accionesResultado");

      const cristal =
        document.getElementById("cristal");

      recompensas.innerHTML = "";
      acciones.innerHTML = "";

      if (aprobado) {
        cristal.style.display = "grid";

        titulo.textContent =
          "¡Felicidades!";

        subtitulo.textContent =
          "Has completado Historia y origen del Tarot";

        mensaje.textContent =
          `Obtuviste ${aciertos} de ${preguntas.length} respuestas correctas. Has demostrado que comprendes los fundamentos históricos y simbólicos del Tarot.`;

        recompensas.innerHTML = `
          <div class="recompensa">
            <strong>Cristal del Conocimiento</strong>
            <span>Artefacto desbloqueado</span>
          </div>

          <div class="recompensa">
            <strong>+100 XP</strong>
            <span>Experiencia obtenida</span>
          </div>

          <div class="recompensa">
            <strong>Codex Quantum</strong>
            <span>Entrada del Módulo 1 completada</span>
          </div>
        `;

        const botonContinuar =
          document.createElement("a");

        botonContinuar.className = "boton";
        botonContinuar.textContent =
          "Ir al Módulo 2";

        botonContinuar.href =
          enlaceModulo2;

        acciones.appendChild(
          botonContinuar
        );
      } else {
        cristal.style.display = "none";

        titulo.textContent =
          "Aún no has superado el desafío";

        subtitulo.textContent =
          `${aciertos} de ${preguntas.length} respuestas correctas`;

        mensaje.textContent =
          "Necesitas responder correctamente al menos 4 de las 5 preguntas. Revisa las microlecciones e inténtalo nuevamente.";

        const botonReintentar =
          document.createElement("button");

        botonReintentar.type = "button";
        botonReintentar.className = "boton";
        botonReintentar.textContent =
          "Reintentar desafío";

        botonReintentar.addEventListener(
          "click",
          reiniciarDesafio
        );

        acciones.appendChild(
          botonReintentar
        );
      }
    }

    function reiniciarDesafio() {
      indiceActual = 0;
      aciertos = 0;
      respondida = false;

      overlay.classList.remove("visible");

      pantallaResultado.classList.remove(
        "activa"
      );

      pantallaQuiz.classList.add(
        "activa"
      );

      mostrarPregunta();
    }

    mostrarPregunta();
  </script>

</body>
</html>
