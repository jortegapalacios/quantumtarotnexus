<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fundamentos del Tarot | Quantum Tarot Nexus</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #020814;
      font-family: Georgia, "Times New Roman", serif;
    }

    .escena {
      position: relative;
      width: 100%;
      min-height: 100vh;

      background-image: url("biblioteca_fundamentos.png");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }

    .volver-academia {
      position: absolute;
      top: 2.5%;
      left: 1.5%;

      width: 15%;
      min-width: 175px;
      max-width: 255px;
      aspect-ratio: 2.6 / 1;

      display: block;
      border-radius: 12px;
      color: transparent;
      text-decoration: none;
      cursor: pointer;

      transition:
        box-shadow 0.25s ease,
        transform 0.25s ease,
        background 0.25s ease;
    }

    .volver-academia:hover {
      background: rgba(45, 175, 255, 0.08);
      box-shadow:
        0 0 14px rgba(66, 191, 255, 0.75),
        0 0 32px rgba(66, 191, 255, 0.45);
      transform: scale(1.03);
    }

    .volver-academia:focus-visible {
      outline: 3px solid #6ed8ff;
      outline-offset: 4px;
    }

    @media (max-width: 900px) {
      .escena {
        min-height: 56.25vw;
        background-size: contain;
        background-position: center top;
      }

      .volver-academia {
        top: 2%;
        left: 1.5%;
        width: 18%;
        min-width: 110px;
      }
    }
  </style>
</head>

<body>

  <main class="escena">

    <a
      class="volver-academia"
      href="academia.html"
      aria-label="Volver a la Academia">
      Volver a la Academia
    </a>

  </main>

</body>
</html>
